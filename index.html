<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>二郎系スピードアタック Ver1.2</title>
<style>
:root{--bg:#263238;--panel:#37474f;--deep:#1b252b;--line:#546e7a;--accent:#ff9800;--soft:#ffb74d;--ok:#4caf50;--bad:#e53935;--text:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{color-scheme:dark;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;padding:8px;background:var(--bg);color:var(--text);font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;touch-action:manipulation;-webkit-user-select:none;user-select:none}
h1{margin:0 0 6px;color:var(--soft);font-size:1.15rem}
.w{width:100%;max-width:440px}
#title,#result{position:fixed;inset:0;background:rgba(20,20,20,.96);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:100;text-align:center;padding:20px}
#result{display:none}
.big{width:260px;margin:5px;padding:13px;border:none;border-radius:10px;color:#fff;font-size:1rem;font-weight:bold;cursor:pointer}
.n{background:var(--accent)}.t{background:#e91e63}.g{background:#607d8b}
#stats{display:flex;justify-content:space-between;background:var(--panel);padding:6px 12px;border-radius:6px;margin-bottom:6px;font-size:.9rem}
#timer{background:var(--deep);border:2px solid var(--line);border-radius:8px;text-align:center;padding:6px;margin-bottom:6px;position:relative}
#timer-text{font-size:1.5rem;color:var(--soft);font-family:ui-monospace,Menlo,monospace}
#cd{position:absolute;inset:0;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,.88);color:var(--soft);font-size:2rem;font-weight:bold;border-radius:6px}
#pen{position:absolute;right:12px;top:4px;color:#ff6e6e;font-weight:bold;opacity:0;pointer-events:none}
#pen.go{animation:fl .9s ease-out}
@keyframes fl{0%{opacity:1;transform:translateY(8px) scale(1.3)}100%{opacity:0;transform:translateY(-14px)}}
#rank{background:var(--panel);border-radius:8px;padding:5px 8px;margin-bottom:6px;font-size:.8rem}
#rank h3{text-align:center;margin:0 0 3px;color:var(--soft);font-size:.9rem}
#rank ol{margin:0;padding:0 0 0 18px}
#order{background:var(--panel);padding:7px;border-radius:8px;border:2px solid var(--soft);text-align:center;margin-bottom:8px;font-size:.85rem}
#order-head.pop{animation:pop .3s}
@keyframes pop{0%{transform:scale(1.35);color:var(--soft)}100%{transform:scale(1)}}
#order-text{font-weight:bold;font-size:1rem;margin-top:2px}
#bowl-wrap{width:176px;height:176px;margin-bottom:6px}
#bowl-wrap svg{width:100%;height:100%;display:block;filter:drop-shadow(0 5px 7px rgba(0,0,0,.55))}
.tg{transform-origin:0 0;transition:transform .14s,opacity .14s}
#bowl-wrap.shake{animation:sh .45s}
@keyframes sh{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px) rotate(-4deg)}40%{transform:translateX(10px) rotate(4deg)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
.bowl{width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,#cfd8dc 65%,#90a4ae 100%);border:4px solid #455a64;display:flex;justify-content:center;align-items:center}
.inner{width:116px;height:116px;background:#3e2723;border-radius:50%;position:relative;overflow:hidden}
.inner>div{position:absolute;border-radius:50%;transition:all .12s}
#b-karame{inset:0;z-index:1}
#b-yasai{top:50%;left:50%;transform:translate(-50%,-50%);background:#dcedc8;z-index:2}
#b-abura{top:55%;left:55%;transform:translate(-50%,-50%);background:#f5e6a1;z-index:3}
#b-ninniku{top:12px;left:50%;transform:translateX(-50%);background:#fff;z-index:4}
.row{display:flex;align-items:center;gap:6px;margin-bottom:6px;padding:3px;border-radius:8px}
.row.bad{background:rgba(229,57,53,.28);outline:2px solid var(--bad)}
.lb{width:4.6em;font-weight:bold;font-size:.85rem;flex:none}
.seg{display:flex;gap:4px;flex:1}
.seg button{flex:1;min-height:44px;border:2px solid var(--line);border-radius:8px;background:var(--deep);color:#cfd8dc;font-size:.78rem;font-weight:bold;cursor:pointer;padding:2px}
.seg button.on{background:var(--accent);border-color:var(--soft);color:#1b1100}
.row.bad .seg button.on{background:var(--bad);border-color:#ff8a80;color:#fff}
#serve{width:100%;border:none;border-radius:8px;padding:13px;background:var(--ok);color:#fff;font-weight:bold;font-size:1.05rem;cursor:pointer;margin:2px 0 6px}
#back{width:100%;border:none;border-radius:8px;padding:7px;background:#607d8b;color:#fff;font-weight:bold;font-size:.85rem;cursor:pointer}
#msg{margin-top:8px;background:rgba(0,0,0,.4);border-radius:8px;padding:8px;text-align:center;font-size:.85rem;line-height:1.35;height:72px;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden}
.m{background:#7e57c2}
#memui{display:none;margin-top:6px}
#barw{height:5px;background:var(--deep);border-radius:3px;overflow:hidden}
#bar{height:100%;width:0;background:var(--soft)}
#peek{width:100%;margin-top:6px;padding:8px;border:2px solid #b39ddb;border-radius:8px;background:transparent;color:#d1c4e9;font-weight:bold;font-size:.85rem;cursor:pointer}
#peek:disabled{opacity:.35;cursor:default}
#title{overflow-y:auto;justify-content:safe center}
#rec{position:fixed;inset:0;background:rgba(20,20,20,.98);z-index:150;display:none;overflow-y:auto;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.rbox{max-width:440px;margin:0 auto;text-align:center}
.sec{background:var(--panel);border-radius:8px;padding:8px 10px;margin:8px 0;text-align:left;font-size:.85rem;line-height:1.6}
.sec h3{margin:0 0 4px;color:var(--soft);font-size:.95rem}
.ach{display:flex;gap:8px;align-items:center;padding:6px;border-radius:6px;margin-bottom:4px;background:var(--deep);opacity:.55}
.ach.on{opacity:1;outline:2px solid var(--soft)}
.ach .ic{font-size:1.4rem;width:1.8em;text-align:center;flex:none}
.ach small{display:block;opacity:.8;line-height:1.3}
#toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--soft);color:#1b1100;font-weight:bold;padding:8px 14px;border-radius:20px;z-index:300;opacity:0;pointer-events:none;transition:opacity .25s;font-size:.85rem;max-width:92vw;text-align:center}
#toast.show{opacity:1}
/* ---- 1画面に収めるレイアウト ---- */
body{height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:0;padding:6px 8px;gap:5px;overflow-y:auto;justify-content:flex-start}
body>*{flex:none}
#top{display:flex;gap:6px;align-items:center}
#top #stats{flex:1;margin:0;padding:4px 10px;font-size:.8rem}
#back{width:40px;height:28px;padding:0;border:none;border-radius:6px;background:#607d8b;color:#fff;font-size:.95rem;cursor:pointer}
#timer{margin:0;padding:3px}
#timer-text{font-size:1.3rem}
#best{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:.7rem;color:#90a4ae}
#order{margin:0;padding:4px 6px;font-size:.7rem}
#order-text{font-size:.95rem;margin-top:1px}
#memui{align-items:center;gap:8px;margin-top:4px}
#barw{flex:1}
#peek{width:auto;margin:0;padding:4px 10px;font-size:.75rem;white-space:nowrap}
#bowl-wrap{flex:1 1 0;min-height:70px;max-height:260px;width:100%;max-width:440px;margin:0;position:relative}
#bowl-wrap svg{position:absolute;inset:0;width:100%;height:100%}
.row{margin-bottom:4px;padding:2px 3px}
.lb{width:4.2em;font-size:.8rem}
.seg button{min-height:40px;font-size:.75rem}
#serve{padding:11px;margin:0}
#msg{margin:0;padding:4px 8px;height:54px;font-size:.72rem;line-height:1.25}
@media (max-height:640px){.seg button{min-height:34px}.row{margin-bottom:2px}#serve{padding:8px}#msg{height:44px}}
</style>
</head>
<body>

<div id="title">
<h2>🍜 二郎系スピードアタック Ver1.2</h2>
<div id="my-title" style="color:var(--soft);font-weight:bold;margin-bottom:6px"></div>
<p>ニンニク！ヤサイ！アブラ！カラメ！<br>注文どおりに最速で仕上げろ！<br><small>5人抜き：ミスは作り直し＋3秒ロス</small></p>
<button class="big n" onclick="start('normal')">通常モード</button>
<button class="big t" onclick="start('ta')">5人抜きタイムアタック</button>
<div style="margin-top:8px">🧠 暗記5人抜き（コールが消える！）<br><small>見直し1回＝+1秒 ／ ミスは作り直し＋3秒</small></div>
<div style="display:flex">
<button class="big m" style="width:84px;padding:10px 2px" onclick="start('mem','easy')">じっくり<br><small>3秒</small></button>
<button class="big m" style="width:84px;padding:10px 2px" onclick="start('mem','mid')">ふつう<br><small>2秒</small></button>
<button class="big m" style="width:84px;padding:10px 2px" onclick="start('mem','hard')">瞬間<br><small>1秒</small></button>
</div>
<button class="big g" style="margin-top:10px" onclick="openRec()">🏅 実績・記録</button>
</div>

<div id="result">
<h2>🎉 完走！</h2>
<div id="final-time" style="font-size:2.2rem;color:var(--soft)">0.00s</div>
<p id="final-detail" style="margin:6px 0"></p>
<p id="final-rec" style="margin:0 0 6px;color:var(--soft);font-weight:bold"></p>
<div id="final-ach" style="margin-bottom:8px;color:var(--soft);font-weight:bold"></div>
<button class="big t" onclick="retry()">もう一度挑戦</button>
<button class="big g" onclick="openRec()">🏅 実績・記録</button>
<button class="big g" onclick="toTitle()">タイトルへ</button>
</div>

<div id="rec"><div class="rbox"><h2>🏅 実績・記録</h2><div id="rec-body"></div>
<button class="big t" onclick="closeRec()">閉じる</button>
<button class="big g" id="reset" onclick="resetAll()">記録をリセット</button></div></div>
<div id="toast"></div>

<div class="w" id="top"><button id="back" onclick="toTitle()">🏠</button><div id="stats"><span id="st-l"></span><span id="st-r"></span></div></div>
<div class="w" id="timer"><span id="best"></span><div id="timer-text">0.00s</div><div id="pen"></div><div id="cd">3</div></div>
<div class="w" id="order"><div id="order-head">＼ 今日の注文 ／</div><div id="order-text">???</div>
<div id="memui"><div id="barw"><div id="bar"></div></div><button id="peek" disabled onclick="peek()">👀 見直し+1秒</button></div></div>

<div id="bowl-wrap"><svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
<defs>
<radialGradient id="gB" cx="50%" cy="40%" r="70%"><stop offset="0" stop-color="#e9cd9f"/><stop offset="1" stop-color="#bf8a52"/></radialGradient>
<radialGradient id="gR" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#d9d2c5"/></radialGradient>
<radialGradient id="gY" cx="40%" cy="35%" r="75%"><stop offset="0" stop-color="#f7fbe6"/><stop offset="1" stop-color="#aac97c"/></radialGradient>
<radialGradient id="gC" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#e8b595"/><stop offset="1" stop-color="#c0805a"/></radialGradient>
<clipPath id="cp"><circle cx="100" cy="100" r="78"/></clipPath>
</defs>
<circle cx="100" cy="100" r="97" fill="url(#gR)" stroke="#bfb8aa" stroke-width="1.5"/>
<circle cx="100" cy="100" r="91" fill="none" stroke="#c62828" stroke-width="3"/>
<circle cx="100" cy="100" r="94.5" fill="none" stroke="#c62828" stroke-width="1.5" stroke-dasharray="7 4"/>
<circle cx="100" cy="100" r="85" fill="#efe6d6" stroke="#cdbfa6" stroke-width="2"/>
<circle cx="100" cy="100" r="78" fill="url(#gB)"/>
<circle id="b-karame" cx="100" cy="100" r="78" fill="#3d1807" opacity="0"/>
<g clip-path="url(#cp)"><g id="n-noodle"></g></g>
<g id="n-chashu">
<g transform="translate(64 142) rotate(-18)"><ellipse rx="27" ry="20" fill="#8e4f2e"/><ellipse rx="24" ry="17" fill="url(#gC)"/><path d="M-16 -3q9 -9 18 -1t16 -4M-14 6q10 -6 17 0t14 -3" stroke="#f5dcc8" stroke-width="2.6" fill="none" stroke-linecap="round" opacity=".85"/></g>
<g transform="translate(112 150) rotate(12)"><ellipse rx="26" ry="19" fill="#8e4f2e"/><ellipse rx="23" ry="16" fill="url(#gC)"/><path d="M-15 -2q9 -8 17 0t15 -3M-12 6q9 -5 16 0t12 -2" stroke="#f5dcc8" stroke-width="2.6" fill="none" stroke-linecap="round" opacity=".85"/></g>
</g>
<g transform="translate(152 66) rotate(16)"><rect x="-15" y="-27" width="30" height="54" rx="3" fill="#15261a" stroke="#0a140d" stroke-width="1.5"/><path d="M-8 -22v44M0 -24v48M8 -22v44" stroke="#2f4a35" stroke-width="1.2" opacity=".7"/></g>
<g id="g-yasai" class="tg"><circle r="41" cy="3" fill="#7d9b55" opacity=".35"/><circle r="40" fill="url(#gY)"/><g id="n-cab"></g><g id="n-spr"></g></g>
<g id="g-abura" class="tg"><g id="n-abu"></g></g>
<g id="g-ninniku" class="tg"><circle r="13" fill="#f6edc2" opacity=".85"/><g id="n-gar"></g></g>
<ellipse cx="68" cy="52" rx="30" ry="10" fill="#fff" opacity=".13" transform="rotate(-28 68 52)"/>
<path d="M30 70A74 74 0 0 1 70 28" stroke="#fff" stroke-width="3" fill="none" opacity=".55" stroke-linecap="round"/>
</svg></div>

<div class="w" id="controls"></div>
<div class="w"><button id="serve" onclick="serve()">ラーメン提供！</button></div>
<div class="w" id="msg">ゲームモードを選んで開始してください</div>

<script>
const $=id=>document.getElementById(id);
const ST={ninniku:["なし","少なめ","マシ","マシマシ"],yasai:["抜き","少なめ","そのまま","マシ","マシマシ"],abura:["なし","少し","マシ","マシマシ"],karame:["なし","カラメ","カラカラ"]};
const LB={ninniku:"ニンニク",yasai:"ヤサイ",abura:"アブラ",karame:"カラメ"};
const DEF={ninniku:0,yasai:2,abura:0,karame:0};
const KEYS=Object.keys(LB), PEN=3, TOTAL=5;
const SK={normal:"jiro_v11_normal",ta:"jiro_v12_ta",mem_easy:"jiro_v12_mem_easy",mem_mid:"jiro_v12_mem_mid",mem_hard:"jiro_v12_mem_hard"};
const STK="jiro_v12_stats";
const blank=()=>({plays:{normal:0,ta:0,mem:0},perfect:0,maxCombo:0,misses:0,peeks:0,clears:{ta:0,mem_easy:0,mem_mid:0,mem_hard:0},ach:{}});
let stt=blank();
const isClear=(c,m)=>c.type==="clear"&&c.mode===m;
const ACH=[
{id:"first",icon:"🍜",name:"初提供",desc:"通常モードでパーフェクトを1杯出す",t:s=>s.perfect>=1},
{id:"combo5",icon:"🔥",name:"売れっ子店員",desc:"通常モードでコンボ5を出す",t:s=>s.maxCombo>=5},
{id:"fast",icon:"⚡",name:"早業",desc:"1杯を2秒以内でパーフェクト",t:(s,c)=>c.type==="perfect"&&c.el<2},
{id:"ta1",icon:"🏁",name:"5人抜き達成",desc:"5人抜きを完走する",t:s=>s.clears.ta>=1},
{id:"mem1",icon:"🧠",name:"暗記見習い",desc:"暗記モードを完走する",t:s=>s.clears.mem_easy+s.clears.mem_mid+s.clears.mem_hard>=1},
{id:"clean",icon:"🎯",name:"一発入魂",desc:"ノーミスで5人抜き（暗記含む）を完走",t:(s,c)=>c.type==="clear"&&c.misses===0},
{id:"p50",icon:"🥢",name:"ベテラン店員",desc:"通算パーフェクト50杯",t:s=>s.perfect>=50},
{id:"combo10",icon:"👑",name:"ロット支配者",desc:"通常モードでコンボ10を出す",t:s=>s.maxCombo>=10},
{id:"ta30",icon:"🚀",name:"神速のコール捌き",desc:"5人抜きを30秒以内（ペナルティ込み）で完走",t:(s,c)=>isClear(c,"ta")&&c.total<30},
{id:"master",icon:"🥇",name:"暗記の達人",desc:"瞬間(1秒)で暗記5人抜きをクリア",t:s=>s.clears.mem_hard>=1},
{id:"memall",icon:"📚",name:"暗記コンプリート",desc:"暗記を3つの難易度すべてクリア",t:s=>s.clears.mem_easy>0&&s.clears.mem_mid>0&&s.clears.mem_hard>0},
{id:"oni",icon:"👹",name:"暗記の鬼",desc:"瞬間(1秒)をノーミス・見直しゼロでクリア",t:(s,c)=>isClear(c,"mem")&&c.level==="hard"&&c.misses===0&&c.peeks===0}
];
const SHOW={easy:3,mid:2,hard:1},LVN={easy:"じっくり",mid:"ふつう",hard:"瞬間"};
let mode="normal",score=0,combo=0,cust=1,penalty=0,misses=0,tStart=0,t0=0,phase="idle",order={},player={},tick=null,tm=[],rk={normal:[],ta:[],mem_easy:[],mem_mid:[],mem_hard:[]},level="mid",peeks=0,showTok=0,callTxt="";
const rkey=()=>mode==="mem"?"mem_"+level:mode;

const later=(f,ms)=>{tm.push(setTimeout(f,ms))};
function clearAll(){tm.forEach(clearTimeout);tm=[];clearInterval(tick)}

/* ---- ランキング ---- */
function load(){for(const k in SK){try{rk[k]=JSON.parse(localStorage.getItem(SK[k])||"[]")}catch(e){rk[k]=[]}}}
function save(){try{for(const k in SK)localStorage.setItem(SK[k],JSON.stringify(rk[k]))}catch(e){}}
function addRank(m,t){rk[m].push(t);rk[m].sort((a,b)=>a-b);const i=rk[m].indexOf(t);rk[m]=rk[m].slice(0,3);save();return i<3}
function renderRank(){const r=rk[rkey()];$("best").textContent=r[0]!==undefined?"🏆"+r[0].toFixed(2)+"s":""}

/* ---- 実績・称号 ---- */
function loadS(){try{const o=JSON.parse(localStorage.getItem(STK)||"null");if(o)stt=Object.assign(blank(),o)}catch(e){}}
function saveS(){try{localStorage.setItem(STK,JSON.stringify(stt))}catch(e){}}
function curTitle(){const u=ACH.filter(a=>stt.ach[a.id]);return u.length?u[u.length-1].icon+" "+u[u.length-1].name:"🍜 見習い店員"}
function updTitle(){$("my-title").textContent="称号："+curTitle()}
let toastT;
function toast(list){const t=$("toast");t.textContent="🏅 称号獲得："+list.map(a=>a.icon+a.name).join("／");t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),3200)}
function check(ctx){
  const got=[];
  ACH.forEach(a=>{if(!stt.ach[a.id]&&a.t(stt,ctx||{})){stt.ach[a.id]=Date.now();got.push(a)}});
  if(got.length){saveS();toast(got);updTitle()}
  return got;
}
let resetArm=false;
function openRec(){
  const row=(n,k)=>"<div>"+n+"："+[0,1,2].map(i=>rk[k][i]!==undefined?rk[k][i].toFixed(2)+"s":"----").join(" / ")+"</div>";
  const done=ACH.filter(a=>stt.ach[a.id]).length;
  const pl=stt.plays;
  $("rec-body").innerHTML=
   '<div class="sec"><h3>あなたの称号</h3><div style="font-size:1.15rem;font-weight:bold">'+curTitle()+"</div></div>"
  +'<div class="sec"><h3>ベスト3</h3>'+row("通常（1杯）","normal")+row("5人抜き","ta")+row("🧠 じっくり3秒","mem_easy")+row("🧠 ふつう2秒","mem_mid")+row("🧠 瞬間1秒","mem_hard")+"</div>"
  +'<div class="sec"><h3>通算</h3><div>プレイ：通常 '+pl.normal+'回 / 5人抜き '+pl.ta+'回 / 暗記 '+pl.mem+'回</div><div>パーフェクト：'+stt.perfect+'杯　最大コンボ：'+stt.maxCombo+'</div><div>5人抜きのミス：'+stt.misses+'回　暗記の見直し：'+stt.peeks+'回</div></div>'
  +'<div class="sec"><h3>称号 '+done+"/"+ACH.length+"</h3>"+ACH.map(a=>{const d=stt.ach[a.id];return '<div class="ach'+(d?" on":"")+'"><span class="ic">'+(d?a.icon:"🔒")+'</span><div><b>'+a.name+"</b><small>"+a.desc+(d?"　✔ "+new Date(d).toLocaleDateString("ja-JP"):"")+"</small></div></div>"}).join("")+"</div>";
  resetArm=false;$("reset").textContent="記録をリセット";
  $("rec").style.display="block";$("rec").scrollTop=0;
}
function closeRec(){$("rec").style.display="none"}
function resetAll(){
  if(!resetArm){resetArm=true;$("reset").textContent="本当に消す？もう一度押す";setTimeout(()=>{resetArm=false;$("reset").textContent="記録をリセット"},3000);return}
  for(const k in rk)rk[k]=[];stt=blank();save();saveS();updTitle();renderRank();openRec();
}

/* ---- ラーメンの絵 ---- */
function buildBowl(){
  let sd=7;const rn=()=>(sd=(sd*9301+49297)%233280)/233280,f=n=>n.toFixed(1);
  let h="";
  for(let i=0;i<10;i++){const y=22+i*17,o=i%2?0:12;
    const d="M"+(-2+o)+" "+y+" q12 -10 24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0";
    h+='<path d="'+d+'" stroke="#c9a64f" stroke-width="8" fill="none" transform="translate(0 1.5)"/><path d="'+d+'" stroke="#f1d786" stroke-width="7" fill="none"/><path d="'+d+'" stroke="#fff3c4" stroke-width="2" fill="none" opacity=".6" transform="translate(0 -1.5)"/>';}
  $("n-noodle").innerHTML=h;
  h="";for(let i=0;i<6;i++){const a=i*1.05+rn()*.4,r=17+rn()*10;
    h+='<ellipse cx="'+f(Math.cos(a)*r)+'" cy="'+f(Math.sin(a)*r)+'" rx="17" ry="9" fill="#c6e29a" stroke="#93b95e" stroke-width="1.2" transform="rotate('+f(a*57)+' '+f(Math.cos(a)*r)+' '+f(Math.sin(a)*r)+')"/>';}
  $("n-cab").innerHTML=h;
  h="";for(let i=0;i<52;i++){const a=rn()*6.28,r=Math.sqrt(rn())*33,x=Math.cos(a)*r,y=Math.sin(a)*r*.9,d=rn()*6.28,l=8+rn()*7,ex=x+Math.cos(d)*l,ey=y+Math.sin(d)*l,cx=x+Math.cos(d+.9)*l*.6,cy=y+Math.sin(d+.9)*l*.6;
    h+='<path d="M'+f(x)+' '+f(y)+'Q'+f(cx)+' '+f(cy)+' '+f(ex)+' '+f(ey)+'" stroke="#8aa75a" stroke-width="3.6" fill="none" stroke-linecap="round" opacity=".5"/><path d="M'+f(x)+' '+f(y)+'Q'+f(cx)+' '+f(cy)+' '+f(ex)+' '+f(ey)+'" stroke="#fbfdf1" stroke-width="2.6" fill="none" stroke-linecap="round"/><circle cx="'+f(ex)+'" cy="'+f(ey)+'" r="2" fill="#f0dc72"/>';}
  $("n-spr").innerHTML=h;
  h="";for(let i=0;i<16;i++){const a=rn()*6.28,r=Math.sqrt(rn())*32,x=Math.cos(a)*r,y=Math.sin(a)*r,w=3.5+rn()*3.5;
    h+='<ellipse cx="'+f(x)+'" cy="'+f(y)+'" rx="'+f(w)+'" ry="'+f(w*.75)+'" fill="#fff4bd" stroke="#e6c35a" stroke-width="1" transform="rotate('+f(rn()*180)+' '+f(x)+' '+f(y)+')"/><circle cx="'+f(x-w*.3)+'" cy="'+f(y-w*.3)+'" r="'+f(w*.25)+'" fill="#fff"/>';}
  $("n-abu").innerHTML=h;
  h="";for(let i=0;i<30;i++){const a=rn()*6.28,r=Math.sqrt(rn())*14;
    h+='<circle cx="'+f(Math.cos(a)*r)+'" cy="'+f(Math.sin(a)*r)+'" r="'+f(1.6+rn()*1.6)+'" fill="'+(i%3?"#fffdf0":"#f2e3a0")+'" stroke="#d9c783" stroke-width=".5"/>';}
  $("n-gar").innerHTML=h;
}

/* ---- 入力UI：段階を直接タップ ---- */
KEYS.forEach(k=>{
  const r=document.createElement("div");r.className="row";r.id="row-"+k;
  r.innerHTML='<span class="lb">'+LB[k]+'</span><div class="seg">'+ST[k].map((s,i)=>'<button data-k="'+k+'" data-i="'+i+'">'+s+'</button>').join("")+"</div>";
  $("controls").appendChild(r);
});
$("controls").addEventListener("pointerdown",e=>{
  const b=e.target.closest("button[data-k]");
  if(!b||phase!=="play")return;
  player[b.dataset.k]=+b.dataset.i;render();
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();serve()}});

/* ---- 描画 ---- */
function render(){
  KEYS.forEach(k=>document.querySelectorAll("#row-"+k+" button").forEach((b,i)=>b.classList.toggle("on",i===player[k])));
  const T=(id,x,y,k)=>{const e=$(id);e.style.transform="translate("+x+"px,"+y+"px) scale("+k+")";e.style.opacity=k?1:0};
  T("g-yasai",100,100,[0,.45,.68,.88,1.08][player.yasai]);
  T("g-abura",112,95,[0,.55,.85,1.15][player.abura]);
  T("g-ninniku",90,80,[0,.55,.85,1.15][player.ninniku]);
  $("b-karame").setAttribute("opacity",[0,.3,.55][player.karame]);
}
function updStats(){
  if(mode==="normal"){$("st-l").textContent="スコア:"+score;$("st-r").textContent="コンボ:"+combo}
  else{$("st-l").textContent="5人抜き:"+cust+"/"+TOTAL;$("st-r").textContent="ミス:"+misses+(mode==="mem"?" 見直し:"+peeks:"")+"（+"+penalty.toFixed(0)+"s）"}
}
function tickFn(){
  const now=performance.now();
  if(mode!=="normal"){if(phase==="play"||phase==="lock")$("timer-text").textContent="累計 "+((now-tStart)/1000+penalty).toFixed(2)+"s"}
  else if(phase==="play")$("timer-text").textContent=((now-t0)/1000).toFixed(2)+"s";
}
function say(h){$("msg").innerHTML=h}
function restart(id,cls){const el=$(id);el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls)}

/* ---- 進行 ---- */
function start(m,lv){
  clearAll();mode=m;if(lv)level=lv;stt.plays[m]++;saveS();peeks=0;showTok=0;$("memui").style.display=m==="mem"?"flex":"none";$("peek").disabled=true;$("bar").style.width="0";score=0;combo=0;cust=1;penalty=0;misses=0;phase="cd";
  $("title").style.display="none";$("result").style.display="none";
  player={...DEF};render();updStats();renderRank();
  $("order-head").textContent=m!=="normal"?"＼ 1人目 ／":"＼ 今日の注文 ／";
  $("order-text").textContent="???";
  $("timer-text").textContent=m!=="normal"?"累計 0.00s":"0.00s";
  say(m==="mem"?"暗記スタート！コールは"+SHOW[level]+"秒で消えます":m==="ta"?"5人抜きスタート！ミスは作り直し＋"+PEN+"秒":"ゲームスタート！");
  tick=setInterval(tickFn,30);
  const cd=$("cd");cd.style.display="flex";let n=3;cd.textContent=n;
  const step=()=>{
    n--;
    if(n>0){cd.textContent=n;later(step,700)}
    else{cd.textContent="GO!";later(()=>{cd.style.display="none";tStart=performance.now();nextCustomer()},450)}
  };
  later(step,700);
}
function nextCustomer(){
  do{order={ninniku:rnd(4),yasai:rnd(5),abura:rnd(4),karame:rnd(3)}}while(KEYS.every(k=>order[k]===DEF[k])||(mode==="mem"&&KEYS.filter(k=>order[k]!==DEF[k]).length>3));
  player={...DEF};render();
  const c=[];
  if(order.ninniku)c.push("ニンニク"+ST.ninniku[order.ninniku]);
  if(order.yasai===0)c.push("ヤサイ抜き");else if(order.yasai!==2)c.push("ヤサイ"+ST.yasai[order.yasai]);
  if(order.abura)c.push("アブラ"+ST.abura[order.abura]);
  if(order.karame)c.push(ST.karame[order.karame]);
  callTxt=c.join("、");
  if(mode==="mem")showCall(SHOW[level]);else $("order-text").textContent=callTxt;
  $("order-head").textContent=mode!=="normal"?"＼ 次！ "+cust+"人目 ／":"＼ 次！ ／";
  restart("order-head","pop");
  t0=performance.now();phase="play";
}
const rnd=n=>Math.floor(Math.random()*n);

function showCall(sec){
  const tok=++showTok;$("order-text").textContent=callTxt;
  const bar=$("bar");bar.style.transition="none";bar.style.width="100%";void bar.offsetWidth;
  bar.style.transition="width "+sec+"s linear";bar.style.width="0%";$("peek").disabled=true;
  later(()=>{if(tok===showTok){$("order-text").textContent="🙈（コールは消えた！）";$("peek").disabled=false}},sec*1000);
}
function peek(){
  if(mode!=="mem"||phase!=="play"||$("peek").disabled)return;
  peeks++;stt.peeks++;saveS();penalty+=1;updStats();
  $("pen").textContent="+1.00s";restart("pen","go");showCall(1.5);
}
function retry(){start(mode,level)}

function serve(){
  if(phase!=="play")return;
  const now=performance.now(),el=(now-t0)/1000;
  const bad=KEYS.filter(k=>player[k]!==order[k]);
  const diff=KEYS.reduce((s,k)=>s+Math.abs(player[k]-order[k]),0);
  phase="lock";

  if(mode!=="normal"){
    if(bad.length){
      misses++;stt.misses++;saveS();penalty+=PEN;updStats();
      bad.forEach(k=>$("row-"+k).classList.add("bad"));
      restart("bowl-wrap","shake");
      $("pen").textContent="+"+PEN.toFixed(2)+"s";restart("pen","go");
      say("<div>💥 ちがう！作り直し！ <b>+"+PEN+"秒</b></div><div style='font-size:.78rem;opacity:.9;margin-top:3px'>赤い段が違っています</div>");
      later(()=>{bad.forEach(k=>$("row-"+k).classList.remove("bad"));player={...DEF};render();phase="play"},800);
      return;
    }
    say("<div>⭕ OK！</div>");
    if(cust<TOTAL){cust++;updStats();later(nextCustomer,200)}else finish();
    return;
  }

  let h;
  if(diff===0){
    combo++;
    const p=500+Math.max(0,Math.floor((5-el)*150))+combo*100;score+=p;
    h="🌟パーフェクト！("+el.toFixed(2)+"秒) +"+p+"pt";
    addRank("normal",el);renderRank();stt.perfect++;stt.maxCombo=Math.max(stt.maxCombo,combo);saveS();check({type:"perfect",el});
  }else if(diff<=2){combo=0;score+=150;h="👍おしい！("+el.toFixed(2)+"秒)"}
  else{combo=0;h="💥ミス！("+el.toFixed(2)+"秒)"}
  updStats();
  say("<div>"+h+"</div><div style='margin-top:4px;font-size:.78rem;opacity:.9'>[正解] "+KEYS.map(k=>LB[k]+":"+ST[k][order[k]]).join(" / ")+"</div>");
  later(nextCustomer,diff===0?500:1100);
}

function finish(){
  const total=(performance.now()-tStart)/1000+penalty;
  clearInterval(tick);phase="done";
  const rec=addRank(rkey(),total);renderRank();
  stt.clears[rkey()]++;saveS();
  const got=check({type:"clear",mode,level,total,misses,peeks});
  $("final-ach").innerHTML=got.map(a=>"🏅 称号獲得："+a.icon+a.name).join("<br>");
  $("timer-text").textContent="累計 "+total.toFixed(2)+"s";
  $("final-time").textContent=total.toFixed(2)+"s";
  $("final-detail").textContent="実タイム "+(total-penalty).toFixed(2)+"s ＋ ミス"+misses+"回×"+PEN+"秒"+(mode==="mem"?" ＋ 見直し"+peeks+"回×1秒":"")+" = +"+penalty.toFixed(1)+"s";
  $("final-rec").textContent=rec?"🏆 ベスト3入り！":"";
  later(()=>{$("result").style.display="flex"},500);
}

function toTitle(){
  clearAll();phase="idle";
  $("cd").style.display="none";$("result").style.display="none";$("title").style.display="flex";
  say("ゲームモードを選んで開始してください");
}

buildBowl();load();loadS();updTitle();player={...DEF};render();renderRank();
</script>
</body>
</html>
