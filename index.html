<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>二郎系スピードアタック Ver1.1</title>

<style>

:root{
    --bg:#263238;
    --panel:#37474f;
    --accent:#ff9800;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:8px;
    background:var(--bg);
    color:#fff;
    font-family:Arial, Helvetica, sans-serif;

    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
}

h1{
    margin:0 0 6px 0;
    color:#ffb74d;
    font-size:1.2rem;
}

/*====================
タイトル・結果
====================*/

#title-screen,
#result-screen{

    position:fixed;
    inset:0;

    background:rgba(20,20,20,.95);

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    z-index:100;
    text-align:center;
    padding:20px;
}

#result-screen{
    display:none;
}

.start-btn{

    width:260px;

    margin:5px;
    padding:12px;

    border:none;
    border-radius:10px;

    cursor:pointer;

    color:#fff;
    font-size:1rem;
    font-weight:bold;
}

.normal-btn{
    background:#ff9800;
}

.ta-btn{
    background:#e91e63;
}

.back-btn{
    background:#607d8b;
}

/*====================
ステータス
====================*/

#game-stats{

    width:100%;
    max-width:440px;

    display:flex;
    justify-content:space-between;

    background:var(--panel);

    padding:6px 12px;

    border-radius:6px;

    margin-bottom:6px;
    font-size:0.9rem;
}

#timer-box{

    width:100%;
    max-width:440px;

    background:#1b252b;

    border:2px solid #546e7a;

    border-radius:8px;

    text-align:center;

    padding:6px;

    margin-bottom:6px;

    position:relative;
}

#timer-text{

    font-size:1.4rem;
    color:#ffb74d;
    font-family:monospace;
}

/*====================
ランキング
====================*/

#ranking{

    width:100%;
    max-width:440px;

    background:var(--panel);

    border-radius:8px;

    padding:6px 8px;
    margin-bottom:6px;
    font-size:0.85rem;
}

#ranking h3{
    text-align:center;
    margin:0 0 4px 0;
    color:#ffb74d;
    font-size:0.95rem;
}

#ranking-list{
    margin:0;
    padding:0 0 0 20px;
}

/*====================
注文
====================*/

#order-box{

    width:100%;
    max-width:440px;

    background:var(--panel);

    padding:8px;

    border-radius:8px;

    border:2px solid #ffb74d;

    text-align:center;

    margin-bottom:8px;
    font-size:0.85rem;
}

#order-text{
    font-weight:bold;
    font-size:0.95rem;
    margin-top:2px;
}

/*====================
丼
====================*/

#bowl-container{

    width:150px;
    height:150px;

    position:relative;

    margin-bottom:10px;
}

.bowl{

    width:150px;
    height:150px;

    border-radius:50%;

    background:
    radial-gradient(circle,
    #cfd8dc 65%,
    #90a4ae 100%);

    border:4px solid #455a64;

    display:flex;
    justify-content:center;
    align-items:center;
}

.bowl-inner{

    width:125px;
    height:125px;

    background:#3e2723;

    border-radius:50%;

    position:relative;

    overflow:hidden;
}

/* カラメ */

#topping-karame{

    position:absolute;
    inset:0;

    border-radius:50%;

    z-index:1;
}

/* ヤサイ */

#topping-yasai{

    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    background:#dcedc8;

    border-radius:50%;

    z-index:2;
}

/* アブラ */

#topping-abura{

    position:absolute;

    top:55%;
    left:55%;

    transform:translate(-50%,-50%);

    background:#f5e6a1;

    border-radius:50%;

    z-index:3;

    opacity:0;
}

/* ニンニク */

#topping-ninniku{

    position:absolute;

    top:14px;
    left:50%;

    transform:translateX(-50%);

    background:white;

    border-radius:50%;

    z-index:4;

    opacity:0;
}

/*====================
ボタン
====================*/

.controls{

    width:100%;
    max-width:440px;
}

.control-row{

    display:flex;
    gap:6px;

    margin-bottom:6px;
}

.topping-btn{

    flex:1;

    border:none;

    border-radius:8px;

    background:#ff9800;
    color:white;

    padding:8px 4px;

    font-weight:bold;

    cursor:pointer;
    font-size:0.9rem;
}

.level{

    display:block;

    margin-top:2px;

    font-size:.7rem;
}

#serve-btn{

    width:100%;

    border:none;

    border-radius:8px;

    padding:10px;

    background:#4caf50;

    color:white;

    font-weight:bold;

    font-size:0.95rem;

    cursor:pointer;

    margin-bottom:6px;
}

.back-title-btn{

    width:100%;

    border:none;

    border-radius:8px;

    padding:7px;

    background:#607d8b;

    color:white;

    font-weight:bold;

    font-size:0.85rem;

    cursor:pointer;
}

/*====================
結果表示（固定高さを設定してガタつき防止）
====================*/

#result-area{

    width:100%;
    max-width:440px;

    margin-top:8px;

    background:rgba(0,0,0,.4);

    border-radius:8px;

    padding:8px;

    text-align:center;
    font-size:0.85rem;
    line-height:1.3;

    /* スマホで画面が崩れないよう高さを固定 */
    height:78px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

#countdown{

    position:absolute;
    inset:0;

    display:none;

    justify-content:center;
    align-items:center;

    background:rgba(0,0,0,.85);

    color:#ffb74d;

    font-size:2rem;
    font-weight:bold;
}

</style>
</head>

<body>

<div id="title-screen">

<h2>🍜 二郎系スピードアタック Ver1.1</h2>

<p>
ニンニク！ヤサイ！アブラ！カラメ！
<br>
注文を正確かつ最速で再現せよ！
</p>

<button class="start-btn normal-btn"
onclick="startGame('normal')">
通常モード
</button>

<button class="start-btn ta-btn"
onclick="startGame('timeattack')">
5人抜きタイムアタック
</button>

</div>

<div id="result-screen">

<h2>🎉 完走！</h2>

<div id="final-time"
style="font-size:2rem;color:#ffb74d;">
0.00s
</div>

<button class="start-btn ta-btn"
onclick="retryTA()">
もう一度挑戦
</button>

<button class="start-btn back-btn"
onclick="returnTitle()">
タイトルへ
</button>

</div>

<h1>🍜 二郎系スピードアタック Ver1.1</h1>

<div id="game-stats">

<span id="stat-left">
スコア:0
</span>

<span id="stat-right">
コンボ:0
</span>

</div>

<div id="timer-box">

<div id="timer-text">
0.00s
</div>

<div id="countdown">
3
</div>

</div>

<div id="ranking">

<h3 id="ranking-title">
🏆ベスト3
</h3>

<ul id="ranking-list"></ul>

</div>

<div id="order-box">

<div>＼ 今日の注文 ／</div>

<div id="order-text">
???
</div>

</div>

<div id="bowl-container">

<div class="bowl">

<div class="bowl-inner">

<div id="topping-karame"></div>

<div id="topping-yasai"></div>

<div id="topping-abura"></div>

<div id="topping-ninniku"></div>

</div>

</div>

</div>

<div class="controls">

    <div class="control-row">

        <button class="topping-btn"
        onclick="addIngredient('ninniku')">
            ニンニク
            <span class="level"
            id="val-ninniku">なし</span>
        </button>

        <button class="topping-btn"
        onclick="addIngredient('yasai')">
            ヤサイ
            <span class="level"
            id="val-yasai">そのまま</span>
        </button>

    </div>

    <div class="control-row">

        <button class="topping-btn"
        onclick="addIngredient('abura')">
            アブラ
            <span class="level"
            id="val-abura">なし</span>
        </button>

        <button class="topping-btn"
        onclick="addIngredient('karame')">
            カラメ
            <span class="level"
            id="val-karame">なし</span>
        </button>

    </div>

    <button id="serve-btn"
    onclick="submitOrder()">
        ラーメン提供！
    </button>

    <button class="back-title-btn"
    onclick="returnTitle()">
        🏠 タイトルへ戻る
    </button>

</div>

<div id="result-area">
    ゲームモードを選んで開始してください
</div>

<script>

/*====================
定数
====================*/

const NINNIKU_STAGES = [
    "なし",
    "少なめ",
    "マシ",
    "マシマシ"
];

const YASAI_STAGES = [
    "抜き",
    "少なめ",
    "そのまま",
    "マシ",
    "マシマシ"
];

const ABURA_STAGES = [
    "なし",
    "少し",
    "マシ",
    "マシマシ"
];

const KARAME_STAGES = [
    "なし",
    "カラメ",
    "カラカラ"
];

/*====================
変数
====================*/

let gameMode="normal";

let score=0;
let combo=0;

let elapsedTime=0;

let timerInterval=null;
let countdownInterval=null;

let taCustomer=1;
let taStartTime=0;

let isPlaying=false;

let order={};
let player={};

let rankingNormal=[];
let rankingTA=[];

/*====================
ランキング
====================*/

function loadRankings(){

    rankingNormal=
    JSON.parse(
        localStorage.getItem(
            "jiro_v11_normal"
        )||"[]"
    );

    rankingTA=
    JSON.parse(
        localStorage.getItem(
            "jiro_v11_ta"
        )||"[]"
    );

    renderRanking();
}

function saveRankings(){

    localStorage.setItem(
        "jiro_v11_normal",
        JSON.stringify(rankingNormal)
    );

    localStorage.setItem(
        "jiro_v11_ta",
        JSON.stringify(rankingTA)
    );
}

function renderRanking(){

    const list=
    document.getElementById(
        "ranking-list"
    );

    list.innerHTML="";

    const ranking=
    gameMode==="timeattack"
    ? rankingTA
    : rankingNormal;

    for(let i=0;i<3;i++){

        const li=
        document.createElement("li");

        if(ranking[i]!==undefined){

            li.textContent=
            (i+1)+"位 : "
            +ranking[i].toFixed(2)
            +"s";

        }else{

            li.textContent=
            (i+1)+"位 : ----";
        }

        list.appendChild(li);
    }
}

/*====================
開始
====================*/

function startGame(mode){

    gameMode=mode;

    document.getElementById(
        "title-screen"
    ).style.display="none";

    document.getElementById(
        "result-screen"
    ).style.display="none";

    document.getElementById(
        "result-area"
    ).innerHTML= (gameMode === "timeattack") ? "5人抜きスタート！" : "ゲームスタート！";

    renderRanking();

    score=0;
    combo=0;

    taCustomer=1;

    updateStats();

    if(gameMode==="timeattack"){

        taStartTime=Date.now();
    }

    initCustomer();
}

/*====================
客生成
====================*/

function initCustomer(){

    order={

        ninniku:
        Math.floor(
            Math.random()*4
        ),

        yasai:
        Math.floor(
            Math.random()*5
        ),

        abura:
        Math.floor(
            Math.random()*4
        ),

        karame:
        Math.floor(
            Math.random()*3
        )
    };

    player={

        ninniku:0,
        yasai:2,
        abura:0,
        karame:0
    };

    updateDisplay();

    document.getElementById(
        "order-text"
    ).innerText="???";

    startCountdown();
}

/*====================
コール生成
====================*/

function revealOrder(){

    let calls=[];

    if(order.ninniku>0){

        calls.push(
        "ニンニク "
        +NINNIKU_STAGES[
            order.ninniku
        ]);
    }

    if(order.yasai===0){

        calls.push(
        "ヤサイ抜き");
    }

    else if(order.yasai!==2){

        calls.push(
        "ヤサイ "
        +YASAI_STAGES[
            order.yasai
        ]);
    }

    if(order.abura>0){

        calls.push(
        "アブラ "
        +ABURA_STAGES[
            order.abura
        ]);
    }

    if(order.karame>0){

        calls.push(
        KARAME_STAGES[
            order.karame
        ]);
    }

    document.getElementById(
        "order-text"
    ).innerText=

    calls.length
    ? calls.join("、")
    : "（そのまま）";
}

/*====================
カウントダウン
====================*/

function startCountdown(){

    isPlaying=false;

    clearInterval(timerInterval);
    clearInterval(countdownInterval);

    if(gameMode === "normal"){
        document.getElementById("timer-text").innerText = "0.00s";
    } else {
        const currentTotal = ((Date.now() - taStartTime) / 1000).toFixed(2);
        document.getElementById("timer-text").innerText = currentTotal + "s (累計)";
    }

    elapsedTime=0;

    const cd=
    document.getElementById(
        "countdown"
    );

    cd.style.display="flex";

    let count=3;

    cd.innerText=count;

    countdownInterval=
    setInterval(()=>{

        count--;

        if(count>0){

            cd.innerText=count;
        }

        else if(count===0){

            cd.innerText="GO!";
            revealOrder();
        }

        else{

            clearInterval(countdownInterval);

            cd.style.display="none";

            startTimer();

            isPlaying=true;
        }

    },800);
}

/*====================
タイマー
====================*/

function startTimer(){

    const start=
    Date.now();

    timerInterval=
    setInterval(()=>{

        if(!isPlaying)
        return;

        elapsedTime=
        (Date.now()-start)
        /1000;

        if(gameMode === "timeattack"){
            const total = (Date.now() - taStartTime) / 1000;
            document.getElementById("timer-text").innerText = total.toFixed(2) + "s (累計)";
        } else {
            document.getElementById("timer-text").innerText = elapsedTime.toFixed(2) + "s";
        }

    },30);
}

/*====================
ボタン操作
====================*/

function addIngredient(type){

    if(!isPlaying) return;

    if(type==="ninniku"){

        player.ninniku=
        (player.ninniku+1)%4;
    }

    else if(type==="yasai"){

        const cycle=[2,0,1,3,4];

        let i=
        cycle.indexOf(player.yasai);

        i=(i+1)%cycle.length;

        player.yasai=
        cycle[i];
    }

    else if(type==="abura"){

        player.abura=
        (player.abura+1)%4;
    }

    else if(type==="karame"){

        player.karame=
        (player.karame+1)%3;
    }

    updateDisplay();
}

/*====================
表示更新
====================*/

function updateDisplay(){

    document.getElementById(
    "val-ninniku"
    ).innerText=
    NINNIKU_STAGES[
    player.ninniku
    ];

    document.getElementById(
    "val-yasai"
    ).innerText=
    YASAI_STAGES[
    player.yasai
    ];

    document.getElementById(
    "val-abura"
    ).innerText=
    ABURA_STAGES[
    player.abura
    ];

    document.getElementById(
    "val-karame"
    ).innerText=
    KARAME_STAGES[
    player.karame
    ];

    /* ヤサイ */

    const yasai=
    document.getElementById(
    "topping-yasai"
    );

    const yasaiSize=[
        0,
        40,
        60,
        80,
        100
    ];

    let ys=
    yasaiSize[player.yasai];

    yasai.style.width=
    ys+"px";

    yasai.style.height=
    ys+"px";

    yasai.style.opacity=
    player.yasai===0
    ? "0"
    : "1";

    /* アブラ */

    const abura=
    document.getElementById(
    "topping-abura"
    );

    const aburaSize=[
        0,
        20,
        35,
        50
    ];

    let as=
    aburaSize[player.abura];

    abura.style.width=
    as+"px";

    abura.style.height=
    as+"px";

    abura.style.opacity=
    player.abura===0
    ? "0"
    : "1";

    /* ニンニク */

    const ninniku=
    document.getElementById(
    "topping-ninniku"
    );

    const nsize={
        1:[15,10],
        2:[28,18],
        3:[40,26]
    };

    if(player.ninniku===0){

        ninniku.style.opacity=
        "0";

    }else{

        ninniku.style.opacity=
        "1";

        ninniku.style.width=
        nsize[
        player.ninniku
        ][0]+"px";

        ninniku.style.height=
        nsize[
        player.ninniku
        ][1]+"px";
    }

    /* カラメ */

    const karame=
    document.getElementById(
    "topping-karame"
    );

    const colors=[

        "rgba(0,0,0,0)",

        "rgba(40,15,0,.45)",

        "rgba(60,10,0,.8)"
    ];

    karame.style.background=
    colors[
    player.karame
    ];
}

/*====================
採点
====================*/

function submitOrder(){

    if(!isPlaying) return;

    isPlaying=false;

    clearInterval(
    timerInterval
    );

    let diff=

    Math.abs(
    player.ninniku
    -order.ninniku)

    +

    Math.abs(
    player.yasai
    -order.yasai)

    +

    Math.abs(
    player.abura
    -order.abura)

    +

    Math.abs(
    player.karame
    -order.karame);

    let msg="";

    if(diff===0){

        combo++;

        let point=

        500+

        Math.max(
            0,
            Math.floor(
            (5-elapsedTime)
            *150
            )
        )

        +(combo*100);

        score+=point;

        msg=
        "🌟パーフェクト！ ("
        +
        elapsedTime.toFixed(2)
        +
        "秒) +"
        +
        point
        +
        "pt";

        if(gameMode==="normal"){

            rankingNormal.push(
            elapsedTime
            );

            rankingNormal.sort(
            (a,b)=>a-b
            );

            rankingNormal=
            rankingNormal.slice(0,3);

            saveRankings();
        }

    }else
    if(diff<=2){

        combo=0;

        score+=150;

        msg=
        "👍おしい！ (" + elapsedTime.toFixed(2) + "秒)";
    }

    else{

        combo=0;

        msg=
        "💥ミス！ (" + elapsedTime.toFixed(2) + "秒)";
    }

    updateStats();

    document.getElementById(
    "result-area"
    ).innerHTML=

    "<div>" + msg + "</div>"

    +

    "<div style='margin-top:4px; font-size:0.78rem; opacity:0.9;'>"

    +

    "[正解]"
    +

    " ニンニク:"
    +
    NINNIKU_STAGES[
    order.ninniku
    ]

    +

    " / ヤサイ:"
    +
    YASAI_STAGES[
    order.yasai
    ]

    +

    " / アブラ:"
    +
    ABURA_STAGES[
    order.abura
    ]

    +

    " / カラメ:"
    +
    KARAME_STAGES[
    order.karame
    ] + "</div>";

    if(gameMode==="normal"){

        setTimeout(

        ()=>{

            initCustomer();

        },

        2000
        );

        return;
    }

    processTimeAttack(
    diff===0
    );
}

/*====================
タイムアタック
====================*/

function processTimeAttack(success){

    if(taCustomer<5){

        taCustomer++;

        updateStats();

        setTimeout(()=>{

            initCustomer();

        },1200);

        return;
    }

    const finalTime=

    (Date.now()
    -taStartTime)

    /1000;

    if(success){

        rankingTA.push(
        finalTime
        );

        rankingTA.sort(
        (a,b)=>a-b
        );

        rankingTA=
        rankingTA.slice(0,3);

        saveRankings();
    }

    document.getElementById(
    "final-time"
    ).innerText=

    finalTime.toFixed(2)
    +"s";

    document.getElementById(
    "result-screen"
    ).style.display=
    "flex";
}

/*====================
UI
====================*/

function updateStats(){

    if(gameMode==="normal"){

        document.getElementById(
        "stat-left"
        ).innerText=

        "スコア:"
        +score;

        document.getElementById(
        "stat-right"
        ).innerText=

        "コンボ:"
        +combo;
    }

    else{

        document.getElementById(
        "stat-left"
        ).innerText=

        "5人抜き:"
        +
        taCustomer
        +
        "/5";

        document.getElementById(
        "stat-right"
        ).innerText=

        "TAモード";
    }

    renderRanking();
}

/*====================
リザルト・タイトル移動
====================*/

function retryTA(){

    document.getElementById(
    "result-screen"
    ).style.display=
    "none";

    startGame(
    "timeattack"
    );
}

function returnTitle(){

    clearInterval(
    timerInterval
    );

    clearInterval(
    countdownInterval
    );

    isPlaying=false;

    document.getElementById(
    "countdown"
    ).style.display=
    "none";

    document.getElementById(
    "result-screen"
    ).style.display=
    "none";

    document.getElementById(
    "title-screen"
    ).style.display=
    "flex";

    document.getElementById(
    "result-area"
    ).innerHTML="ゲームモードを選んで開始してください";
}

/*====================
起動
====================*/

window.onload=()=>{

    loadRankings();

    player={

        ninniku:0,
        yasai:2,
        abura:0,
        karame:0
    };

    updateDisplay();
};
